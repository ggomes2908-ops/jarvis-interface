
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d16">
  <meta name="description" content="JARVIS - Assistente pessoal inteligente">

  <title>J.A.R.V.I.S.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #48c8ff;
      --blue-light: #8ce4ff;
      --background: #080d16;
      --panel: rgba(14, 25, 40, 0.82);
      --text: #e8f7ff;
      --muted: #8296a9;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 38%, #102a42 0%, transparent 55%),
        var(--background);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      background-image:
        linear-gradient(rgba(72,200,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72,200,255,.12) 1px, transparent 1px);
      background-size: 45px 45px;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 5%;
      border-bottom: 1px solid rgba(72,200,255,.13);
    }

    .logo {
      color: var(--blue);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #35e69a;
      box-shadow: 0 0 12px #35e69a;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(850px, 92%);
      margin: 35px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .assistant {
      width: 100%;
      text-align: center;
      padding: 10px 0 25px;
    }

    .orb {
      width: 190px;
      height: 190px;
      margin: 0 auto 25px;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, #163e5a 0%, #0c1c2d 48%, #080d16 72%);
      border: 1px solid rgba(72,200,255,.55);
      box-shadow:
        0 0 30px rgba(72,200,255,.25),
        inset 0 0 30px rgba(72,200,255,.18);
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(72,200,255,.65);
      border-radius: 50%;
    }

    .orb::before {
      inset: -12px;
      border-top-color: transparent;
      border-bottom-color: transparent;
      animation: rotate 9s linear infinite;
    }

    .orb::after {
      inset: 9px;
      border-left-color: transparent;
      border-right-color: transparent;
      animation: rotate 5s linear infinite reverse;
    }

    .core {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle, #e4fbff, #48c8ff 40%, #0875ad 75%);
      box-shadow: 0 0 35px #48c8ff;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      50% {
        transform: scale(1.12);
        box-shadow: 0 0 55px #48c8ff;
      }
    }

    .listening .core {
      animation: pulse .6s ease-in-out infinite;
      background: radial-gradient(circle, white, #42ffcb 55%, #087d79);
      box-shadow: 0 0 45px #42ffcb;
    }

    h1 {
      font-size: 29px;
      letter-spacing: 7px;
      font-weight: 400;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 2px;
    }

    .chat {
      width: 100%;
      min-height: 230px;
      max-height: 360px;
      overflow-y: auto;
      padding: 20px;
      margin-top: 15px;
      border: 1px solid rgba(72,200,255,.16);
      border-radius: 15px;
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .message {
      margin-bottom: 17px;
      line-height: 1.6;
      font-size: 14px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .message strong {
      display: block;
      margin-bottom: 5px;
      color: var(--blue);
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    .message.user strong {
      color: #b3c6d7;
    }

    .welcome {
      color: var(--muted);
      text-align: center;
      padding: 45px 10px;
      font-size: 13px;
      line-height: 1.7;
    }

    .composer {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      padding: 10px;
      border: 1px solid rgba(72,200,255,.3);
      border-radius: 14px;
      background: rgba(12,22,35,.95);
    }

    input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px;
      font-size: 14px;
    }

    input::placeholder {
      color: #72879a;
    }

    button {
      border: none;
      cursor: pointer;
      transition: .2s;
    }

    .mic, .send {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .mic {
      background: rgba(72,200,255,.12);
      color: var(--blue);
      border: 1px solid rgba(72,200,255,.25);
    }

    .mic:hover {
      background: rgba(72,200,255,.25);
    }

    .send {
      background: var(--blue);
      color: #06111b;
      font-size: 21px;
      font-weight: bold;
    }

    .send:hover {
      background: var(--blue-light);
      transform: scale(1.04);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 14px;
      text-align: center;
      color: #71869a;
      font-size: 11px;
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      color: #53697d;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 5%;
      }

      .logo {
        font-size: 17px;
        letter-spacing: 3px;
      }

      main {
        margin: 25px auto;
      }

      .orb {
        width: 155px;
        height: 155px;
      }

      .core {
        width: 60px;
        height: 60px;
      }

      h1 {
        font-size: 24px;
        letter-spacing: 5px;
      }

      .chat {
        min-height: 200px;
        max-height: 310px;
        padding: 15px;
      }

      .composer {
        gap: 7px;
      }

      .mic, .send {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="status">
      <span class="status-dot"></span>
      <span id="statusText">SISTEMA ONLINE</span>
    </div>
  </header>

  <main>
    <section class="assistant">
      <div class="orb" id="orb">
        <div class="core"></div>
      </div>

      <h1>JARVIS</h1>
      <p class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</p>
    </section>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        Bom dia, senhor.<br>
        Sistemas visuais inicializados.<br>
        Aguardando comunicação.
      </div>
    </section>

    <form class="composer" id="chatForm">
      <button class="mic" type="button" id="micButton"
        aria-label="Ativar microfone">🎙</button>

      <input id="messageInput" type="text"
        placeholder="Fale comigo, senhor..." autocomplete="off">

      <button class="send" type="submit"
        aria-label="Enviar mensagem">➤</button>
    </form>

    <p class="hint" id="hint">
      INTERFACE DE DEMONSTRAÇÃO • CONEXÃO COM A IA EM BREVE
    </p>
  </main>

  <footer>
    J.A.R.V.I.S. • PERSONAL ASSISTANT SYSTEM
  </footer>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const micButton = document.getElementById("micButton");
    const orb = document.getElementById("orb");
    const statusText = document.getElementById("statusText");
    const hint = document.getElementById("hint");

    function addMessage(author, content, type = "") {
      welcome?.remove();

      const message = document.createElement("div");
      message.className = "message " + type;

      const title = document.createElement("strong");
      title.textContent = author;

      const text = document.createElement("div");
      text.textContent = content;

      message.append(title, text);
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const value = input.value.trim();
      if (!value) return;

      addMessage("SENHOR", value, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(
          "JARVIS",
          "Recebi sua mensagem. Minha conexão com o núcleo de inteligência ainda está sendo preparada. Em breve poderei responder utilizando minha IA."
        );
      }, 500);
    });

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = false;
      recognition.interimResults = false;

      micButton.addEventListener("click", () => {
        try {
          recognition.start();
          orb.classList.add("listening");
          statusText.textContent = "OUVINDO...";
          hint.textContent = "ESTOU OUVINDO, SENHOR...";
        } catch (error) {
          hint.textContent = "AGUARDE UM INSTANTE E TENTE NOVAMENTE.";
        }
      });

      recognition.onresult = (event) => {
        input.value = event.results[0][0].transcript;
        hint.textContent = "MENSAGEM RECONHECIDA. ENVIE PARA CONTINUAR.";
      };

      recognition.onerror = () => {
        hint.textContent = "NÃO FOI POSSÍVEL ACESSAR O MICROFONE.";
      };

      recognition.onend = () => {
        orb.classList.remove("listening");
        statusText.textContent = "SISTEMA ONLINE";
      };
    } else {
      micButton.addEventListener("click", () => {
        hint.textContent =
          "RECONHECIMENTO DE VOZ NÃO DISPONÍVEL NESTE NAVEGADOR. USE A DIGITAÇÃO OU O DITADO DO TECLADO.";
      });
    }
  </script>
</body>
</html>
